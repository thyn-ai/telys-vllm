name: Tag stable release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: tag-stable-release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Validate checks and create immutable version tag
    if: github.repository == 'thyn-ai/telys-vllm'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Inspect the stable version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python .github/scripts/tag_release.py inspect

      - name: Verify merged PR, CI, Codna, lineage, and tag absence
        id: verify
        if: steps.version.outputs.changed == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/tag_release.py verify

      - name: Mint the repository-scoped release App token
        id: app-token
        if: steps.verify.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4614082" # Public App ID: algenta-sdk-sync
          private-key: ${{ secrets.ALGENTA_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: thyn-ai
          repositories: telys-vllm
          permission-contents: write

      - name: Revalidate and create only the missing immutable tag
        if: steps.verify.outputs.ready == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_READ_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python .github/scripts/tag_release.py create
