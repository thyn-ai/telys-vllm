[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telys-vllm"
version = "0.1.1"
description = "Telys external KV/prefix-cache connector for vLLM (KVConnectorBase_V1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["typing_extensions>=4.8"]

[project.optional-dependencies]
vllm = ["vllm>=0.11"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["telys_vllm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
